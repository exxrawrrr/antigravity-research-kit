<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07090c"/>
    <stop offset="58%" stop-color="#111318"/>
    <stop offset="100%" stop-color="#1c140e"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFD35D"/>
    <stop offset="52%" stop-color="#F6B83C"/>
    <stop offset="100%" stop-color="#D87938"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFD35D"/>
    <stop offset="100%" stop-color="#F2A93A"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity=".55"/>
  </filter>
</defs>

<rect width="1600" height="1040" fill="#050506"/>
