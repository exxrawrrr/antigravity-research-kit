name: validate

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell and manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = '.\GET-EXXRAWRRR.ps1'
          if (-not (Test-Path -LiteralPath $bootstrap)) { throw 'GET-EXXRAWRRR.ps1 is missing.' }
          $bootstrapTokens = $null
          $bootstrapErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($bootstrap, [ref]$bootstrapTokens, [ref]$bootstrapErrors) | Out-Null
          if ($bootstrapErrors.Count) { throw "Bootstrap parser error: $($bootstrapErrors[0].Message)" }
          Get-ChildItem installer,release,tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.FullName): $($errors[0].Message)" }
          }
          Get-Content config/packages.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content config/ide.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content pack/rafdi-academic-research-pack/plugin.json -Raw | ConvertFrom-Json | Out-Null

      - name: Validate launchers and version metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'START.cmd',
            'INSTALL.bat',
            'STATUS.cmd',
            'VERIFY.bat',
            'REPAIR.bat',
            'ROLLBACK-MANAGED-SETUP.bat'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing launcher: $path" }
          }

          if (-not (Test-Path -LiteralPath 'FRIENDS-START.md')) { throw 'Beginner guide is missing.' }

          $version = (Get-Content .\VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }

          if (-not (Test-Path -LiteralPath '.\assets\terminal-preview-final.webp')) {
            throw 'Final README terminal preview asset is missing.'
          }

          $readme = Get-Content .\README.md -Raw
          if ($readme -notmatch 'assets/terminal-preview-final\.webp') {
            throw 'README does not reference the final terminal preview asset.'
          }

      - name: Validate academic skill structure
        shell: pwsh
        run: |
          $skills = Get-ChildItem pack/rafdi-academic-research-pack/skills -Directory
          if ($skills.Count -ne 5) { throw "Expected 5 skills, found $($skills.Count)" }
          foreach ($skill in $skills) {
            $path = Join-Path $skill.FullName 'SKILL.md'
            $text = Get-Content $path -Raw
            if ($text -notmatch '(?s)^---.*?name:.*?description:.*?---') { throw "Invalid frontmatter: $path" }
            if ($text -notmatch 'Made by Rafdi D\. Ulhaq') { throw "Missing attribution: $path" }
          }
