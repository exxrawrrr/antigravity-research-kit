name: clean-windows-acceptance

on:
  push:
    branches:
      - main
      - phase/05-release-candidate
    paths-ignore:
      - 'docs/**'
      - 'ROADMAP.md'
      - 'README.md'
      - 'assets/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'ROADMAP.md'
      - 'README.md'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Host baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
          Write-Host "PS=$($PSVersionTable.PSVersion)"
          winget --version

      - name: Recover disposable runner WinGet source
        shell: pwsh
        run: |
          winget source update --name winget --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WinGet runner source is damaged; resetting only default winget on this disposable runner."
            winget source reset --name winget --force --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "Unable to reset disposable runner winget source" }
            winget source update --name winget --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "Unable to refresh disposable runner winget source" }
          }

      - name: Static validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem installer,release -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.FullName): $($errors[0].Message)" }
          }
          Get-Content config/packages.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content config/ide.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content pack/rafdi-academic-research-pack/plugin.json -Raw | ConvertFrom-Json | Out-Null

      - name: EXXRAWRRR CMD visual preview
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\GET-EXXRAWRRR.ps1 -Preview
          if ($LASTEXITCODE -ne 0) { throw "CMD preview failed with exit=$LASTEXITCODE" }

      - name: Verify one-command published release bootstrap
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\GET-EXXRAWRRR.ps1 -DownloadOnly
          if ($LASTEXITCODE -ne 0) { throw "Published-release bootstrap failed with exit=$LASTEXITCODE" }

      - name: Fresh-host install
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\installer\install.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Installer exit=$LASTEXITCODE" }

      - name: Read-only verification
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\installer\verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "Verifier exit=$LASTEXITCODE" }

      - name: Idempotent rerun
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\installer\install.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { throw "Second installer exit=$LASTEXITCODE" }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\installer\verify.ps1
          if ($LASTEXITCODE -ne 0) { throw "Second verifier exit=$LASTEXITCODE" }

      - name: Friends safety and rollback regression
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\friends-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw "Friends regression exit=$LASTEXITCODE" }

      - name: Failure-path gate
        shell: pwsh
        run: |
          $manifest = '.\config\packages.json'
          $temp = '.\config\packages.json.acceptance-test'
          Move-Item $manifest $temp
          try {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\installer\install.ps1 -DryRun -NoPause
            $code = $LASTEXITCODE
          } finally {
            Move-Item $temp $manifest
          }
          if ($code -ne 22) { throw "Expected missing-manifest exit 22, got $code" }
          Write-Host "FAILURE_PATH_OK exit=$code"
          exit 0

      - name: Build current release candidate
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim() + '-ci'
          "ARK_CI_VERSION=$version" >> $env:GITHUB_ENV
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\release\build-release.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Verify standalone archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:ARK_CI_VERSION
          $zip = Get-Item ".\dist\Antigravity-Research-Kit-v$version.zip"
          $shaFile = Get-Item ($zip.FullName + '.sha256')
          $line = (Get-Content $shaFile.FullName -Raw).Trim()
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'ZIP checksum mismatch' }

          $dest = Join-Path $env:RUNNER_TEMP 'ark-standalone'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force
          $root = Join-Path $dest "Antigravity-Research-Kit-v$version"
          foreach ($launcher in @('START.cmd','INSTALL.bat','STATUS.cmd','VERIFY.bat','REPAIR.bat','ROLLBACK-MANAGED-SETUP.bat')) {
            if (-not (Test-Path (Join-Path $root $launcher))) { throw "$launcher missing from standalone package" }
          }
          if (-not (Test-Path (Join-Path $root 'GET-EXXRAWRRR.ps1'))) {
            throw 'CMD installer bootstrap missing from release ZIP'
          }
          if (-not (Test-Path (Join-Path $root 'FRIENDS-START.md'))) {
            throw 'Beginner guide missing from standalone package'
          }
          if (-not (Test-Path (Join-Path $root 'assets\terminal-preview-final.webp'))) {
            throw 'README terminal preview asset missing from standalone package'
          }

          $manifest = Join-Path $root 'MANIFEST-SHA256.txt'
          $lines = Get-Content $manifest | Where-Object { $_ -match '^[0-9a-fA-F]{64}\s{2}' }
          foreach ($entry in $lines) {
            $parts = $entry -split '\s{2}',2
            $file = Join-Path $root ($parts[1] -replace '/','\')
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $parts[0].ToLowerInvariant()) { throw "Manifest mismatch: $($parts[1])" }
          }
          Write-Host "STANDALONE_HASH_GATE_OK files=$($lines.Count)"

      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-research-kit-current-ci
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
